[package]
name = "aptos-indexer-processor-example"
version = "0.1.0"
edition = "2021"
rust-version = "1.93.1"


[dependencies]
ahash = { version = "0.8.13", features = ["serde"] }
anyhow = "1.0.105"
aptos-indexer-processor-sdk = { git = "https://github.com/aptos-labs/aptos-indexer-processor-sdk.git", rev = "aptos-indexer-processor-sdk-v2.4.1", features = [
    "server_framework",
] }
async-trait = "0.1.92"
chrono = { version = "0.4.45", features = ["clock", "serde"] }
clap = { version = "4.6.9", features = ["derive", "unstable-styles"] }
# Do NOT enable the postgres feature here, it is conditionally enabled in a feature
# block in the Cargo.toml file for the processor crate.
# https://github.com/aptos-labs/aptos-indexer-processors/pull/325
diesel = { version = "~2.3.10", features = [
    "chrono",
    "postgres_backend",
    "numeric",
    "serde_json",
] }
diesel-async = { version = "0.9.2", features = [
    "async-connection-wrapper",
    "postgres",
    "bb8",
    "tokio",
] }
diesel_migrations = { version = "2.3.2", features = ["postgres"] }
field_count = "0.1.1"
futures-util = "0.3.34"
jemallocator = { package = "tikv-jemallocator", version = "0.6.1", features = [
    "profiling",
    "unprefixed_malloc_on_supported_platforms",
] }
num_cpus = "1.17.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
strum = { version = "0.24.1", features = ["derive"] }
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["full"] }
url = { version = "2.5.9", features = ["serde"] }

# Postgres SSL support
native-tls = "0.2.18"
postgres-native-tls = "0.5.3"
tokio-postgres = "0.7.18"

# test transactions example
test-transactions-example = { path = "../test-transactions-example" }

[dev-dependencies]
testcontainers = "0.28.0"